<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vite substitutes the configured build-time brand here, including for
      crawlers that don't execute the client bundle. Runtime owner branding
      continues to update metadata after the platform API loads.

      Link-preview tags are deliberately minimal: an og:url / og:image must be an
      absolute URL, which belongs to the deployment, not the repository. If the
      client wants rich previews, set PUBLIC_ORIGIN on the server and fill these
      two in with the public origin at build time.
    -->
    <meta
      name="description"
      content="__APP_SUBTITLE__"
    />
    <meta name="theme-color" content="#30072f" />
    <meta property="og:title" content="__APP_NAME__" />
    <meta
      property="og:description"
      content="__APP_SUBTITLE__"
    />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/ninety-club-180.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/ninety-club-crown-controller-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/ninety-club-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/ninety-club-16.png" />
    <link rel="shortcut icon" href="/icon/ninety-club.ico" />
    <link rel="manifest" href="__MANIFEST_HREF__" />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
